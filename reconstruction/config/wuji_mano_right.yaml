# AdaptiveOptimizerAnalytical configuration for retargeting MANO keypoints (from
# HaWoR) onto the Wuji Hand, RIGHT hand.
#
# Derived from wuji-retargeting's adaptive_analytical_wuji_glove_right.yaml, with the
# two glove-specific calibrations removed:
#   * thumb_skip_pip dropped the thumb MCP because the glove SDK reconstructs it
#     badly; MANO's thumb MCP is reliable, so keeping it gives the optimizer a real
#     constraint instead of discarding one.
#   * mediapipe_rotation was a glove mounting correction, and applying it to MANO
#     keypoints just rotates an already-correct wrist frame.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: false
  w_hyper: 1.0
  soft_min: 0.0
  w_couple: 0.1
  couple_ratio: 0.7
  lp_alpha: 0.2

  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.0, 1.0]
    middle: [1.0, 1.0, 1.0]
    ring:   [1.0, 1.0, 1.0]
    pinky:  [1.05, 1.05, 1.1]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }

  wrist_offset_cm: [0.0, 0.0, 0.0]
  thumb_offset_cm: [0.0, 0.0, 0.0]
