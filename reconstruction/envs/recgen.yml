# `recgen` env: explicitly requested conda packages + pinned pip packages.
# Create with:  conda env create -f envs/recgen.yml
# Installed from local checkouts, so not listed below. Afterwards, in this env:
#   pip install -e ~/recgen
#   pip install <mip-splatting>/submodules/diff-gaussian-rasterization
#   pip install <nvdiffrast>
# (both were built from temporary checkouts; see RecGen's install notes)
name: recgen
channels:
- defaults
- nvidia
- pytorch
dependencies:
- pip=26.2.1
- python=3.10
- pytorch-cuda=12.1
- pip:
