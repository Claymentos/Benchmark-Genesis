# `sam3` env: explicitly requested conda packages + pinned pip packages.
# Create with:  conda env create -f envs/sam3.yml
# Installed from local checkouts, so not listed below. Afterwards, in this env:
#   pip install -e ~/Benchmark-Genesis/co-tracker
#   pip install -e ~/do-as-i-do/reconstruction/modules/sam3
