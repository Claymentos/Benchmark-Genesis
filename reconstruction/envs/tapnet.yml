# `tapnet` env: explicitly requested conda packages + pinned pip packages.
# Create with:  conda env create -f envs/tapnet.yml
# Installed from local checkouts, so not listed below. Afterwards, in this env:
#   pip install -e ~/do-as-i-do/reconstruction/modules/tapnet
name: tapnet
channels:
- defaults
- conda-forge
dependencies:
- pip=26.2.1
- python=3.10
- ffmpeg
- pip:
